<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 533" preserveAspectRatio="xMidYMid slice">
  <!-- Sky background -->
  <rect width="400" height="533" fill="#0d3028"/>

  <!-- Stars -->
  <circle cx="40" cy="28" r="1" fill="white" opacity="0.55"/>
  <circle cx="110" cy="15" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="185" cy="20" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="270" cy="10" r="1.1" fill="white" opacity="0.65"/>
  <circle cx="350" cy="25" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="385" cy="12" r="1" fill="white" opacity="0.4"/>
  <circle cx="65" cy="55" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="140" cy="45" r="1" fill="white" opacity="0.45"/>
  <circle cx="225" cy="38" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="310" cy="52" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="370" cy="48" r="1" fill="white" opacity="0.35"/>
  <circle cx="20" cy="90" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="95" cy="80" r="0.9" fill="white" opacity="0.35"/>

  <!-- Mountain silhouettes behind building -->
  <path d="M-10,350 L80,230 L140,290 L200,200 L260,270 L330,210 L410,250 L410,400 L-10,400Z" fill="#0a2520"/>

  <!-- Ground -->
  <path d="M-10,440 Q100,425 200,432 Q300,440 410,428 L410,533 L-10,533Z" fill="#081810"/>

  <!-- Main building - resort/casa club -->
  <g transform="translate(200, 370)">
    <!-- Building shadow/depth -->
    <rect x="-95" y="-140" width="190" height="140" fill="#0a2820"/>
    
    <!-- Main building face -->
    <rect x="-90" y="-135" width="180" height="135" fill="#112e24"/>

    <!-- Roof -->
    <polygon points="-95,-135 0,-175 95,-135" fill="#0d2820"/>
    <!-- Roof ridge highlight -->
    <line x1="0" y1="-175" x2="-95" y2="-135" stroke="#153f35" stroke-width="1.5"/>
    <line x1="0" y1="-175" x2="95" y2="-135" stroke="#1a4a3e" stroke-width="1"/>

    <!-- Chimney -->
    <rect x="40" y="-185" width="18" height="50" fill="#0d2820"/>
    <rect x="38" y="-188" width="22" height="5" fill="#0a2520"/>
    <!-- Smoke wisps -->
    <path d="M49,-190 Q53,-205 48,-218 Q44,-230 50,-242" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M54,-192 Q59,-207 54,-220 Q50,-232 56,-244" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Windows - floor 3 -->
    <rect x="-60" y="-120" width="28" height="22" rx="2" fill="#1a4a3e" opacity="0.6"/>
    <rect x="-15" y="-120" width="28" height="22" rx="2" fill="#1a4a3e" opacity="0.8"/>
    <!-- Lit window -->
    <rect x="-13" y="-118" width="24" height="18" rx="1" fill="#aebc82" opacity="0.35"/>
    <rect x="33" y="-120" width="28" height="22" rx="2" fill="#1a4a3e" opacity="0.6"/>

    <!-- Windows - floor 2 -->
    <rect x="-60" y="-85" width="28" height="22" rx="2" fill="#1a4a3e" opacity="0.7"/>
    <rect x="-15" y="-85" width="28" height="22" rx="2" fill="#1a4a3e" opacity="0.5"/>
    <rect x="33" y="-85" width="28" height="22" rx="2" fill="#1a4a3e" opacity="0.9"/>
    <!-- Lit window -->
    <rect x="35" y="-83" width="24" height="18" rx="1" fill="#aebc82" opacity="0.3"/>

    <!-- Windows - floor 1 -->
    <rect x="-60" y="-50" width="28" height="22" rx="2" fill="#1a4a3e" opacity="0.5"/>
    <rect x="33" y="-50" width="28" height="22" rx="2" fill="#1a4a3e" opacity="0.7"/>

    <!-- Main entrance door -->
    <rect x="-18" y="-50" width="36" height="50" rx="3" fill="#0d2820"/>
    <path d="M-18,-50 Q0,-65 18,-50" fill="#0a2520"/>
    <!-- Door frame -->
    <rect x="-18" y="-50" width="36" height="50" rx="3" fill="none" stroke="#1d5445" stroke-width="1.5"/>
    <!-- Door handle -->
    <circle cx="10" cy="-25" r="3" fill="#aebc82" opacity="0.7"/>

    <!-- Steps -->
    <rect x="-30" y="0" width="60" height="6" rx="1" fill="#0d2820"/>
    <rect x="-24" y="-6" width="48" height="6" rx="1" fill="#112820"/>

    <!-- Column decorations -->
    <rect x="-85" y="-135" width="10" height="135" fill="#0e2e24"/>
    <rect x="75" y="-135" width="10" height="135" fill="#0e2e24"/>

    <!-- Decorative accent at top -->
    <rect x="-90" y="-140" width="180" height="5" rx="2" fill="#aebc82" opacity="0.25"/>
  </g>

  <!-- Side wings of the building -->
  <g opacity="0.85">
    <!-- Left wing -->
    <rect x="60" y="275" width="70" height="95" fill="#0f2c22"/>
    <rect x="65" y="285" width="20" height="15" rx="2" fill="#1a4a3e" opacity="0.7"/>
    <rect x="95" y="285" width="20" height="15" rx="2" fill="#1a4a3e" opacity="0.5"/>
    <rect x="65" y="315" width="20" height="15" rx="2" fill="#1a4a3e" opacity="0.6"/>
    <rect x="95" y="315" width="20" height="15" rx="2" fill="#1a4a3e" opacity="0.8"/>
    <!-- Lit -->
    <rect x="97" y="317" width="16" height="11" rx="1" fill="#aebc82" opacity="0.2"/>
    <!-- Left wing roof -->
    <polygon points="55,275 95,248 135,275" fill="#0a2520"/>
    
    <!-- Right wing -->
    <rect x="270" y="275" width="70" height="95" fill="#0f2c22"/>
    <rect x="275" y="285" width="20" height="15" rx="2" fill="#1a4a3e" opacity="0.6"/>
    <rect x="305" y="285" width="20" height="15" rx="2" fill="#1a4a3e" opacity="0.8"/>
    <!-- Lit -->
    <rect x="307" y="287" width="16" height="11" rx="1" fill="#aebc82" opacity="0.25"/>
    <rect x="275" y="315" width="20" height="15" rx="2" fill="#1a4a3e" opacity="0.5"/>
    <rect x="305" y="315" width="20" height="15" rx="2" fill="#1a4a3e" opacity="0.7"/>
    <!-- Right wing roof -->
    <polygon points="265,275 305,248 345,275" fill="#0a2520"/>
  </g>

  <!-- Landscape details -->
  <!-- Pathway/driveway -->
  <path d="M160,440 Q175,420 200,415 Q225,420 240,440" fill="none" stroke="#122820" stroke-width="20" opacity="0.6"/>

  <!-- Small shrubs/bushes -->
  <ellipse cx="120" cy="435" rx="20" ry="12" fill="#0d2820" opacity="0.8"/>
  <ellipse cx="280" cy="435" rx="20" ry="12" fill="#0d2820" opacity="0.8"/>
  <ellipse cx="150" cy="428" rx="15" ry="9" fill="#112e24" opacity="0.7"/>
  <ellipse cx="250" cy="428" rx="15" ry="9" fill="#112e24" opacity="0.7"/>

  <!-- Pine trees (sides) -->
  <g opacity="0.65">
    <polygon points="20,460 40,390 60,460" fill="#081a16"/>
    <polygon points="18,453 40,378 62,453" fill="#0a2220"/>
    <polygon points="340,460 360,390 380,460" fill="#081a16"/>
    <polygon points="338,453 360,378 382,453" fill="#0a2220"/>
  </g>

  <!-- Soft light glow from windows -->
  <ellipse cx="200" cy="290" rx="60" ry="25" fill="#aebc82" opacity="0.04"/>

  <!-- Vignette -->
  <defs>
    <radialGradient id="vig3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>
  </defs>
  <rect width="400" height="533" fill="url(#vig3)"/>
</svg>
